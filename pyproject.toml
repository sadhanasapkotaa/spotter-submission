[project]
name = "spotter-backend"
version = "0.1.0"
description = "Django API that plans the cheapest fuel stops for a US road trip"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==6.1.2",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary]>=3.3.6",
    "scipy>=1.18.1",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "hypothesis>=6.170.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
    "shapely>=2.2.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "C4"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405", "E402"]
"tests/**" = ["S"]
"scripts/**" = ["S", "E402"]
