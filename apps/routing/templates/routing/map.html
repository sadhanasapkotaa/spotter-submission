<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotter: cheapest fuel route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
  aside { padding: 14px; overflow: auto; border-right: 1px solid #8884; }
  #map { height: 100vh; }
  h1 { font-size: 1.1rem; margin: 0 0 10px; }
  label { display: block; font-size: .8rem; margin: 8px 0 2px; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 7px; }
  button { margin-top: 10px; padding: 8px 14px; cursor: pointer; }
  .summary { margin: 14px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { border: 1px solid #8886; border-radius: 8px; padding: 8px; }
  .card b { display: block; font-size: 1.15rem; }
  table { width: 100%; border-collapse: collapse; font-size: .78rem; }
  th, td { text-align: left; padding: 4px 3px; border-bottom: 1px solid #8884; }
  .err { color: #c0392b; margin-top: 10px; white-space: pre-wrap; }
  .approx { color: #b9770e; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: auto 60vh; height: auto; } #map { height: 60vh; } }
</style>
</head>
<body>
<aside>
  <h1>Cheapest fuel stops, USA</h1>
  <label for="start">Start (lat,lng or City, ST)</label>
  <input id="start" type="text" value="New York, NY">
  <label for="end">Finish</label>
  <input id="end" type="text" value="Los Angeles, CA">
  <button id="go">Plan route</button>
  <div id="out"></div>
</aside>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([39.5, -98.35], 4);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18, attribution: '&copy; OpenStreetMap'}).addTo(map);
const layer = L.layerGroup().addTo(map);
const out = document.getElementById('out');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function plan() {
  const s = document.getElementById('start').value, e = document.getElementById('end').value;
  history.replaceState(null, '', '?start=' + encodeURIComponent(s) + '&end=' + encodeURIComponent(e));
  out.textContent = 'Planning...';
  layer.clearLayers();
  let r, d;
  try {
    r = await fetch('/api/route/?start=' + encodeURIComponent(s) + '&end=' + encodeURIComponent(e));
    d = await r.json();
  } catch (err) { out.innerHTML = '<div class="err">Network error</div>'; return; }
  if (!r.ok) { out.innerHTML = '<div class="err">' + esc(typeof d.detail === 'string' ? d.detail : JSON.stringify(d.detail || d.error)) + '</div>'; return; }

  const line = L.geoJSON(d.route, {style: {color: '#2563eb', weight: 4}}).addTo(layer);
  L.marker([d.start.lat, d.start.lng]).bindPopup('Start').addTo(layer);
  L.marker([d.end.lat, d.end.lng]).bindPopup('Finish').addTo(layer);
  d.fuel_stops.forEach((st, i) => {
    L.circleMarker([st.location.lat, st.location.lng], {radius: 8, color: '#b91c1c', fillColor: '#ef4444', fillOpacity: .9})
      .bindPopup('<b>' + (i + 1) + '. ' + esc(st.name) + '</b><br>' + esc(st.city) + ', ' + esc(st.state) +
        '<br>Mile ' + st.route_mile + ' (' + st.offset_miles + ' mi off route)<br>$' + st.price_per_gallon +
        '/gal x ' + st.gallons + ' gal = <b>$' + st.cost + '</b>').addTo(layer);
  });
  map.fitBounds(line.getBounds(), {padding: [20, 20]});

  const rows = d.fuel_stops.map((st, i) =>
    '<tr><td>' + (i + 1) + '</td><td>' + esc(st.name) + '<br><small class="' + (st.position_quality === 'geocoded' ? '' : 'approx') + '">' +
    esc(st.city) + ', ' + esc(st.state) + (st.position_quality === 'geocoded' ? '' : ' (approx. position)') + '</small></td>' +
    '<td>' + st.route_mile + '</td><td>$' + st.price_per_gallon + '</td><td>' + st.gallons + '</td><td>$' + st.cost + '</td></tr>').join('');
  out.innerHTML =
    '<div class="summary"><div class="card"><b>' + d.distance_miles + ' mi</b>distance</div>' +
    '<div class="card"><b>$' + d.total_fuel_cost + '</b>fuel cost</div>' +
    '<div class="card"><b>' + d.fuel_stops.length + '</b>fuel stops</div>' +
    '<div class="card"><b>' + d.timings_ms.total + ' ms</b>' + (d.timings_ms.route_cached ? 'cached route' : 'total') + '</div></div>' +
    '<table><tr><th>#</th><th>Station</th><th>Mile</th><th>$/gal</th><th>Gal</th><th>Cost</th></tr>' + rows + '</table>' +
    '<p><small>Starts with a full ' + d.assumptions.start_fuel_gallons + ' gal tank (not charged). ' +
    d.assumptions.vehicle_range_miles + ' mi range, ' + d.assumptions.miles_per_gallon + ' mpg.</small></p>';
}
document.getElementById('go').onclick = plan;
const q = new URLSearchParams(location.search);
if (q.get('start')) document.getElementById('start').value = q.get('start');
if (q.get('end')) document.getElementById('end').value = q.get('end');
if (q.get('start') && q.get('end')) plan();
</script>
</body>
</html>
