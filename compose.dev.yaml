# Shared dev server: production image, containerised PostGIS for convenience.
services:
  web:
    image: spotter-backend:dev
    container_name: spotter-dev-web
    env_file: envs/dev.env
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    container_name: spotter-dev-db
    env_file: envs/dev.env
    restart: unless-stopped
    volumes:
      - spotter_dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spotter_dev_pgdata:
