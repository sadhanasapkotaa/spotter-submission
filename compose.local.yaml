services:
  web:
    build:
      target: local
    container_name: spotter-local-web
    env_file: envs/local.env
    environment:
      RUN_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app                 # hot reload
      - /app/.venv             # keep the image's venv, not the host's
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgis/postgis:17-3.5-alpine
    container_name: spotter-local-db
    env_file: envs/local.env
    volumes:
      - spotter_local_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  spotter_local_pgdata:
